version: '3.9'

services:
  app:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - .:/var/www/html:delegated
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: luiza_labs
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
